name: Tofu Validate
on:
  pull_request:
    paths:
      - "infra/**"
      - "flake.lock"
concurrency:
  group: tofu-validate-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: https://github.com/cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31
        with:
          github_access_token: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      # No credentials and no state access, so a pull request cannot mutate anything.
      - run: nix run .#validate
