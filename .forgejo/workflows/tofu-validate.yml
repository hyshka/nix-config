name: Tofu Validate
on:
  pull_request:
    paths:
      - "infra/**"
      - "flake.lock"
concurrency:
  group: tofu-validate-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: https://github.com/cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      # No credentials and no state access, so a pull request cannot mutate anything.
      - name: Pre-build the CI shell
        run: nix build --no-link .#devShells.x86_64-linux.ci
      - run: nix develop .#ci -c nix run .#validate
