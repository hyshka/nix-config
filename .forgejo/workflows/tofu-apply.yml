name: Tofu Apply
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "flake.lock"
  pull_request:
    # Opt in per pull request by adding the `tofu-plan` label. Runs stay plan-only.
    types: [labeled, synchronize, reopened]
    paths:
      - "infra/**"
      - "flake.lock"
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [plan, apply]
        default: plan
concurrency:
  group: tofu-apply
  cancel-in-progress: false
jobs:
  apply:
    name: Apply
    # Only a main-branch run applies. A pull request or a dispatch on another
    # branch plans, and the run step forces plan mode for those.
    if: forgejo.event_name == 'workflow_dispatch' || (forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main') || (forgejo.event_name == 'pull_request' && contains(forgejo.event.pull_request.labels.*.name, 'tofu-plan'))
    runs-on: nixos
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Plan or apply
        run: |
          set -euo pipefail

          if [ -z "${CREDENTIALS_DIRECTORY:-}" ]; then
            echo "CREDENTIALS_DIRECTORY is not set; the runner service is missing its LoadCredential entries" >&2
            exit 1
          fi

          export INCUS_CONF="$RUNTIME_DIRECTORY"
          export AWS_ACCESS_KEY_ID="$(cat "$CREDENTIALS_DIRECTORY/aws-access-key")"
          export AWS_SECRET_ACCESS_KEY="$(cat "$CREDENTIALS_DIRECTORY/aws-secret-key")"
          export TF_ENCRYPTION="$(cat "$CREDENTIALS_DIRECTORY/tofu-encryption")"

          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

          action="${{ inputs.action }}"
          if [ -z "$action" ]; then
            action=apply
          fi

          # Forgejo reports the base branch as ref_name on pull_request events,
          # so the event name is what tells a PR run apart from a main run.
          if [ "${{ forgejo.event_name }}" = pull_request ] || [ "${{ forgejo.ref_name }}" != main ]; then
            if [ "$action" != plan ]; then
              echo "not on main: forcing plan (requested ${action})" >&2
            fi
            action=plan
          fi

          if [ "$action" = plan ]; then
            nix run .#plan
          else
            nix run .#apply
          fi
