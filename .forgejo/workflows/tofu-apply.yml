name: Tofu Apply
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "flake.lock"
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [plan, apply]
        default: plan
concurrency:
  group: tofu-apply
  cancel-in-progress: false
jobs:
  apply:
    name: Apply
    if: forgejo.ref == 'refs/heads/main'
    runs-on: nixos
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reclaim store space
        run: |
          set -euo pipefail

          # Realising the full image set needs headroom. Free only the shortfall,
          # so the rest of the store stays cached between runs.
          target=25 # GiB
          avail=$(df -BG --output=avail /nix | tail -n1 | tr -dc '0-9')
          if [ "$avail" -lt "$target" ]; then
            echo "nix store has ${avail}G free; collecting down to ${target}G"
            nix-collect-garbage --max-freed "$((target - avail))G"
          fi
      - name: Plan or apply
        run: |
          set -euo pipefail

          if [ -z "${CREDENTIALS_DIRECTORY:-}" ]; then
            echo "CREDENTIALS_DIRECTORY is not set; the runner service is missing its LoadCredential entries" >&2
            exit 1
          fi

          export INCUS_CONF="$RUNTIME_DIRECTORY"
          export AWS_ACCESS_KEY_ID="$(cat "$CREDENTIALS_DIRECTORY/aws-access-key")"
          export AWS_SECRET_ACCESS_KEY="$(cat "$CREDENTIALS_DIRECTORY/aws-secret-key")"
          export TF_ENCRYPTION="$(cat "$CREDENTIALS_DIRECTORY/tofu-encryption")"

          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

          action="${{ inputs.action }}"
          if [ -z "$action" ]; then
            action=apply
          fi

          if [ "$action" = plan ]; then
            nix run .#plan
          else
            nix run .#apply
          fi
      - name: Push images to the binary cache
        run: |
          set -euo pipefail

          if [ -z "${CREDENTIALS_DIRECTORY:-}" ]; then
            echo "CREDENTIALS_DIRECTORY is not set; the runner service is missing its LoadCredential entries" >&2
            exit 1
          fi

          # attic writes config.toml (with the token) here; keep it off the runner's home.
          export XDG_CONFIG_HOME="$(mktemp -d)"
          trap 'rm -rf "$XDG_CONFIG_HOME"' EXIT

          attic login home https://cache.home.hyshka.com "$(cat "$CREDENTIALS_DIRECTORY/attic-token")"
          nix run .#image-paths | attic push home:nix-config --stdin
