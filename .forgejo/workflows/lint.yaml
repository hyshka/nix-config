name: Lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/DeterminateSystems/nix-installer-action@v23
      - name: Lint nix files
        run: |
          nix fmt
          git diff --exit-code
