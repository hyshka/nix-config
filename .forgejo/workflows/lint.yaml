name: Lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: https://github.com/cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32
      - name: Pre-build the CI shell
        run: nix build --no-link .#devShells.x86_64-linux.ci
      - name: Lint
        run: nix develop .#ci -c prek run --all-files
      # Fill the runner's local binary cache so the next job substitutes locally.
      - name: Seed the binary cache
        if: always()
        run: |
          nix copy --to 'file:///nix-cache?compression=zstd' .#devShells.x86_64-linux.ci
          nix flake archive --to 'file:///nix-cache?compression=zstd' \
            || echo '::warning:: flake archive failed; the next job refetches inputs from GitHub'
