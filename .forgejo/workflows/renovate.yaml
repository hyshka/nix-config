name: Renovate
on:
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC
  workflow_dispatch:
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    name: Renovate
    # ref_name is "main" for both push and schedule runs.
    if: forgejo.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/renovatebot/renovate:44.238.1@sha256:61ed3234bfdb63c0251bb3cd5f33168dbc6813268b75be41c680b96486381b09
      volumes:
        - /var/lib/forgejo-cache/renovate:/cache
    env:
      LOG_LEVEL: info
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://code.home.hyshka.com/api/v1
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      RENOVATE_GIT_AUTHOR: "Renovate Bot <noreply@hyshka.com>"
      RENOVATE_REPOSITORIES: hyshka/nix-config
      RENOVATE_ONBOARDING: "false"
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_CACHE_DIR: /cache
      RENOVATE_REPOSITORY_CACHE: enabled
      RENOVATE_PR_CONCURRENT_LIMIT: "10"
      RENOVATE_PR_HOURLY_LIMIT: "5"
    steps:
      - name: Run Renovate
        run: renovate
