name: Renovate
on:
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC
  workflow_dispatch:
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    name: Renovate
    if: forgejo.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/renovatebot/renovate:44.177.0@sha256:431bda180686945be4d3899f489b3161401f0df0972bf3521118b381aa355f15
      volumes:
        - /var/lib/forgejo-cache/renovate:/cache
    env:
      LOG_LEVEL: info
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://code.home.hyshka.com/api/v1
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      RENOVATE_GIT_AUTHOR: "Renovate Bot <noreply@hyshka.com>"
      RENOVATE_REPOSITORIES: hyshka/nix-config
      RENOVATE_ONBOARDING: "false"
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_CACHE_DIR: /cache
      RENOVATE_REPOSITORY_CACHE: enabled
      RENOVATE_PR_CONCURRENT_LIMIT: "10"
      RENOVATE_PR_HOURLY_LIMIT: "5"
    steps:
      - name: Run Renovate
        run: renovate
