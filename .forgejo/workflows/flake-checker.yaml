name: Flake Checker
on:
  pull_request:
  push:
    branches: [main]
jobs:
  flake-checker:
    name: Flake Checker
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/DeterminateSystems/flake-checker-action@v14
        with:
          fail-mode: true
          send-statistics: false
